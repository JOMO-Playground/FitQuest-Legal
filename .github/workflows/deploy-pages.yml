name: Deploy public FitQuest website

on:
  # Keep the artifact workflow available for the future. The repository
  # currently publishes from main/root because the owner's hosted Actions
  # runners are locked at the account level.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create public runtime configuration
        shell: bash
        run: |
          {
            echo 'window.FITQUEST_CONFIG = {'
            echo '  supabaseUrl: ${{ toJSON(vars.FITQUEST_SUPABASE_URL) }},'
            echo '  supabaseAnonKey: ${{ toJSON(secrets.FITQUEST_SUPABASE_ANON_KEY) }},'
            echo '};'
          } > runtime-config.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
